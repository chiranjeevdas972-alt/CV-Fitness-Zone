<svg xmlns="http://www.w3.org/2000/svg" viewBox="220 50 500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="C Vidya Logo Icon">
  <title>C Vidya Logo Icon</title>
  <defs>
    <linearGradient id="cvidya-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#1D4ED8" />
      <stop offset="70%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="cvidya-icon-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <filter id="cvidya-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <g opacity="0.18">
    <circle cx="470" cy="300" r="230" fill="url(#cvidya-icon-grad)" filter="url(#cvidya-icon-glow)" />
  </g>

  <!-- Logo Mark -->
  <g id="LogoMark">
    <!-- Depth Shadow -->
    <g opacity="0.18" transform="translate(3, 7)">
      <path d="M 320,80 L 620,300 L 480,300 L 320,183 Z" fill="#000000" />
      <path d="M 320,450 L 320,350 L 510,210 L 510,310 Z" fill="#000000" />
      <path d="M 320,520 L 320,490 L 410,424 L 430,440 Z" fill="#000000" />
    </g>

    <!-- Base Vibrant Gradient Shapes -->
    <g fill="url(#cvidya-icon-grad)">
      <path id="TopArm" d="M 320,80 L 620,300 L 480,300 L 320,183 Z" />
      <path id="MiddleBlock" d="M 320,450 L 320,350 L 510,210 L 510,310 Z" />
      <path id="BottomWedge" d="M 320,520 L 320,490 L 410,424 L 430,440 Z" />
    </g>

    <!-- Specular Highlight Overlay -->
    <g fill="url(#cvidya-icon-shine)" style="mix-blend-mode: overlay;">
      <path d="M 320,80 L 620,300 L 480,300 L 320,183 Z" />
      <path d="M 320,450 L 320,350 L 510,210 L 510,310 Z" />
      <path d="M 320,520 L 320,490 L 410,424 L 430,440 Z" />
    </g>
  </g>
</svg>
